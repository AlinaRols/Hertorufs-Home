<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter pop-up | Heroturfs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#E3332B;--accent-h:#c8302a;--fd:'Barlow Condensed',system-ui,sans-serif;--fb:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--fb);color:#15181c;background:#0d0e11;-webkit-font-smoothing:antialiased;min-height:100vh}

/* faux page background (so it reads as a popup over the site) */
.demo-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(1000px 560px at 50% -6%,rgba(227,51,43,.14),transparent 60%),linear-gradient(180deg,#14161a,#0b0c0e)}
.demo-hint{position:fixed;left:0;right:0;top:26px;z-index:1;text-align:center;color:rgba(255,255,255,.45);font-size:12px;letter-spacing:.02em}
.demo-hint button{margin-left:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;font-family:var(--fb);font-weight:600;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;transition:background .2s}
.demo-hint button:hover{background:rgba(255,255,255,.2)}

/* corner pop-up */
.np-pop{position:fixed;right:26px;bottom:26px;z-index:50;width:370px;max-width:calc(100vw - 32px);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4);padding:26px 24px 22px;opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .35s ease,transform .4s cubic-bezier(.22,1,.36,1)}
.np-pop.open{opacity:1;transform:none;pointer-events:auto}
.np-pop::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent)}

.np-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:none;background:transparent;color:#aeb6bd;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s,color .2s}
.np-close:hover{background:#f1f2f4;color:#15181c}
.np-close svg{width:16px;height:16px}

.np-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.np-pill{background:var(--accent);color:#fff;font-family:var(--fd);font-weight:900;font-size:14px;letter-spacing:.04em;padding:6px 12px;border-radius:8px;line-height:1}
.np-limit{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9aa4ac}

.np-title{font-family:var(--fd);font-size:30px;font-weight:900;line-height:.98;letter-spacing:-.01em;color:#15181c;margin-bottom:9px}
.np-title em{font-style:normal;color:var(--accent)}
.np-sub{font-size:14px;line-height:1.55;color:#5a6672;margin-bottom:18px}

.np-form{display:flex;flex-direction:column;gap:10px}
.np-form input{width:100%;font-family:var(--fb);font-size:14px;color:#15181c;background:#fff;border:1px solid #d6dbe0;border-radius:10px;padding:13px 15px;transition:border-color .18s,box-shadow .18s}
.np-form input::placeholder{color:#aeb6bd}
.np-form input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,51,43,.12)}
.np-btn{width:100%;font-family:var(--fb);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;cursor:pointer;transition:background .18s,transform .18s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.np-btn:hover{background:var(--accent-h);transform:translateY(-1px)}
.np-btn svg{width:16px;height:16px}
.np-fine{font-size:11px;color:#9aa4ac;margin-top:12px;line-height:1.5;text-align:center}

/* success */
.np-done{display:none;text-align:center;padding:6px 0 2px}
.np-done.show{display:block}
.np-check{width:50px;height:50px;border-radius:50%;background:rgba(37,211,102,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.np-check svg{width:26px;height:26px;color:#25D366}
.np-done h3{font-family:var(--fd);font-size:24px;font-weight:900;color:#15181c;margin-bottom:7px}
.np-done p{font-size:13.5px;color:#5a6672;line-height:1.55;margin-bottom:14px}
.np-code{display:inline-block;font-family:var(--fd);font-weight:900;font-size:17px;letter-spacing:.12em;color:var(--accent);background:#fdeeec;border:1px dashed #f0b6b1;border-radius:9px;padding:9px 20px}

@media(max-width:480px){
  .np-pop{right:12px;left:12px;bottom:12px;width:auto}
  .np-title{font-size:27px}
}
</style>
</head>
<body>

<div class="demo-bg"></div>
<div class="demo-hint">Demo of the newsletter pop-up<button onclick="npOpen()">Show pop-up again</button></div>

<div class="np-pop open" id="npPop" role="dialog" aria-modal="false" aria-label="Subscribe and get 5% off">
  <button class="np-close" onclick="npClose()" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <div id="npForm">
    <div class="np-head">
      <span class="np-pill">5% OFF</span>
      <span class="np-limit">Until 30 September</span>
    </div>
    <h2 class="np-title">Save on your <em>first order.</em></h2>
    <p class="np-sub">Subscribe and take your training to the next level.</p>
    <form class="np-form" onsubmit="npSubmit(event)">
      <input type="email" placeholder="Your email" required>
      <button type="submit" class="np-btn">Claim my discount
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="np-fine">No spam. Unsubscribe anytime.</p>
  </div>

  <div class="np-done" id="npDone">
    <div class="np-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h3>You're in! 🎉</h3>
    <p>Here's your <strong>5% off</strong> code for your first order:</p>
    <span class="np-code">HERO5</span>
  </div>
</div>

<script>
  var pop=document.getElementById('npPop');
  function npOpen(){ document.getElementById('npForm').style.display=''; document.getElementById('npDone').classList.remove('show'); var i=pop.querySelector('input'); if(i)i.value=''; pop.classList.add('open'); }
  function npClose(){ pop.classList.remove('open'); }
  function npSubmit(e){ e.preventDefault(); document.getElementById('npForm').style.display='none'; document.getElementById('npDone').classList.add('show'); }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') npClose(); });
</script>

</body>
</html>
